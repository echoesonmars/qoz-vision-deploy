services:
  postgres:
    image: postgres:16-alpine
    container_name: qoz-offline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qoz}
      POSTGRES_USER: ${POSTGRES_USER:-kap1c}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Qereq11@}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kap1c} -d ${POSTGRES_DB:-qoz}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: qoz-offline-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kap1c}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Qereq11@}
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    container_name: qoz-offline-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-kap1c} $${MINIO_ROOT_PASSWORD:-Qereq11@};
      mc mb -p local/$${STORAGE_BUCKET:-records} || true;
      mc anonymous set none local/$${STORAGE_BUCKET:-records} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kap1c}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Qereq11@}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-records}
    restart: "no"

  backend:
    image: qoz-offline-backend:latest
    container_name: qoz-offline-backend
    restart: unless-stopped
    env_file:
      - .env.backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kap1c}:${POSTGRES_PASSWORD_ENC:-Qereq11%40}@postgres:5432/${POSTGRES_DB:-qoz}
      SUPABASE_S3_ENDPOINT: http://minio:9000
      SUPABASE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-kap1c}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-Qereq11@}
      SUPABASE_S3_REGION: us-east-1
      STORAGE_BUCKET: ${STORAGE_BUCKET:-records}
      MEDIAMTX_API_URL: http://mediamtx:9997
    command:
      [
        "sh",
        "-c",
        "mkdir -p /tmp/qoz/live /tmp/qoz/incidents /tmp/qoz/lessons && node dist/index.js",
      ]
    expose:
      - "8080"
    volumes:
      - backend-tmp:/tmp/qoz
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      mediamtx:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  web:
    image: qoz-offline-web:latest
    container_name: qoz-offline-web
    restart: unless-stopped
    env_file:
      - .env.web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kap1c}:${POSTGRES_PASSWORD_ENC:-Qereq11%40}@postgres:5432/${POSTGRES_DB:-qoz}
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_BACKEND_URL: /backend
      NEXT_PUBLIC_CAMERA_HLS_BASE: /hls
      NEXT_PUBLIC_STREAM_WS_URL: /backend/api/live
      SESSION_COOKIE_SECURE: "false"
      STORAGE_UPLOAD_BACKEND: s3
      SUPABASE_S3_ENDPOINT: http://minio:9000
      SUPABASE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-kap1c}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-Qereq11@}
      SUPABASE_S3_REGION: us-east-1
      STORAGE_BUCKET: ${STORAGE_BUCKET:-records}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: qoz-offline-mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    expose:
      - "8888"
      - "9997"

  nginx:
    image: nginx:1.27-alpine
    container_name: qoz-offline-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - backend
      - mediamtx

  migrate:
    image: qoz-offline-backend:latest
    container_name: qoz-offline-migrate
    profiles: ["migrate"]
    working_dir: /app
    volumes:
      - ./scripts:/migrate/scripts:ro
      - ./web/db:/migrate/db:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kap1c}:${POSTGRES_PASSWORD_ENC:-Qereq11%40}@postgres:5432/${POSTGRES_DB:-qoz}
      QOZ_NODE_MODULES: /app/node_modules
      QOZ_DB_DIR: /migrate/db
    entrypoint: ["node", "/migrate/scripts/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  miniodata:
  backend-tmp:
