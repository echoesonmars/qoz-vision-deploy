map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream qoz_web {
  server web:3000;
}

upstream qoz_backend {
  server backend:8080;
}

upstream qoz_mediamtx {
  server mediamtx:8888;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 5120m;

  location /backend/ {
    proxy_pass http://qoz_backend/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 5120m;
  }

  location ~ ^/hls/(?<stream_path>[^/]+)/video1_stream\.m3u8$ {
    proxy_pass http://qoz_mediamtx/$stream_path/index.m3u8$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect ~^/(?<redir_path>.+)$ /hls/$redir_path;
    proxy_cookie_path / /hls/;
    proxy_buffering off;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-cache" always;
  }

  location ~ ^/hls/(?<stream_path>[^/]+)/(?<stream_file>.+)$ {
    proxy_pass http://qoz_mediamtx/$stream_path/$stream_file$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect ~^/(?<redir_path>.+)$ /hls/$redir_path;
    proxy_cookie_path / /hls/;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://qoz_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
